<title>Join the QuantumX Discord Community</title>

<style>
  :root {
    --purple: #a855f7;
    --ink: #0a0a0a;
    --shade: rgba(0, 0, 0, 0.07);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    align-items: safe center;
    justify-items: center;
    padding: clamp(2rem, 5vw, 5rem) clamp(1.25rem, 5vw, 2rem);
    background: var(--purple);
    color: var(--ink);
    font-family: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow-x: hidden;
  }

  /* Oversized Discord glyph bleeding off the bottom-right, as in the card art */
  .watermark {
    position: fixed;
    right: -6vw;
    bottom: -14vh;
    width: min(62vw, 46rem);
    color: var(--shade);
    pointer-events: none;
    z-index: 0;
  }
  .watermark svg { width: 100%; height: auto; display: block; }

  main {
    position: relative;
    z-index: 1;
    width: min(64rem, 100%);
    min-width: 0;
  }

  .eyebrow {
    margin: 0 0 clamp(1rem, 2vw, 1.75rem);
    font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
    font-size: clamp(0.72rem, 1.1vw, 0.85rem);
    font-weight: 500;
    letter-spacing: 0.34em;
    text-transform: uppercase;
  }

  h1 {
    margin: 0;
    font-family: "Archivo", "Archivo Black", ui-sans-serif, system-ui, sans-serif;
    font-variation-settings: "wdth" 82, "wght" 900;
    font-weight: 900;
    font-size: clamp(2.25rem, 8.4vw, 6.25rem);
    line-height: 0.9;
    letter-spacing: -0.018em;
    text-transform: uppercase;
    text-wrap: balance;
  }

  .lede {
    margin: clamp(1.5rem, 3.5vw, 2.5rem) 0 0;
    max-width: 44ch;
    font-size: clamp(1.02rem, 1.65vw, 1.4rem);
    line-height: 1.55;
  }

  .cta {
    display: inline-flex;
    align-items: center;
    gap: 0.85em;
    margin-top: clamp(1.75rem, 4vw, 3rem);
    padding: 1.1em 1.9em;
    background: var(--ink);
    color: #fff;
    font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
    font-size: clamp(0.82rem, 1.2vw, 1rem);
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    text-decoration: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .cta svg { width: 1.45em; height: 1.45em; flex: none; fill: currentColor; }
  .cta:hover, .cta:focus-visible { transform: translate(-3px, -3px); box-shadow: 6px 6px 0 var(--ink); }
  .cta:active { transform: translate(0, 0); box-shadow: none; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }

  /* Redirect status: a thin bar that runs for the length of the timeout */
  .status {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    margin-top: clamp(1.5rem, 3vw, 2.25rem);
    font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
    font-size: 0.75rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(0, 0, 0, 0.62);
  }
  /* An author `display` beats the UA's [hidden] rule, so restore it explicitly. */
  .status[hidden] { display: none; }
  .track { width: min(11rem, 34vw); height: 3px; background: var(--shade); overflow: hidden; }
  .bar { width: 100%; height: 100%; background: var(--ink); transform-origin: left; transform: scaleX(0); }
  .redirecting .bar { animation: fill var(--delay, 2200ms) linear forwards; }
  @keyframes fill { to { transform: scaleX(1); } }

  @media (prefers-reduced-motion: reduce) {
    .cta { transition: none; }
    .redirecting .bar { animation: none; transform: scaleX(1); }
  }

  @media (max-width: 40rem) {
    .watermark { right: -26vw; bottom: -4vh; width: 92vw; }
    .lede { max-width: none; }
    .cta { width: 100%; justify-content: center; padding-inline: 1rem; }
  }
</style>
</head>

  <noscript>
    <!-- Inside <noscript> so crawlers, which ignore it, still read the card above. -->
    <meta http-equiv="refresh" content="0; url=https://discord.gg/gFZvXRsxr" />
  </noscript>

  <script>
    (function () {
      var INVITE = "https://discord.gg/gFZvXRsxr";
      var DELAY = 2200;

      var params = new URLSearchParams(location.search);

      // Tagged the same way quantumx.community/join does it, so Discord arrivals
      // from this domain stay distinguishable in our own logs and analytics.
      var target = new URL(INVITE);
      target.searchParams.set("utm_source", "join.quantumx.community");
      target.searchParams.set("utm_medium", "join");
      var ref = params.get("ref");
      if (ref) target.searchParams.set("utm_campaign", ref.slice(0, 40));

      var link = document.getElementById("invite");
      link.href = target.toString();

      // ?stay=1 keeps the page open for screenshots and preview debugging.
      if (params.get("stay") === "1") return;

      var status = document.getElementById("status");
      status.hidden = false;
      document.body.classList.add("redirecting");
      document.body.style.setProperty("--delay", DELAY + "ms");

      // replace() so the back button returns to where they came from,
      // instead of bouncing them straight back into Discord.
      setTimeout(function () {
        location.replace(target.toString());
      }, DELAY);
    })();
  </script>
